server:
  port: 8080

spring:
  application:
    name: catastrofecl-api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:3001"
              - "https://catastrofescl.vercel.app"
              - "https://dashboard.catastrofescl.vercel.app"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - X-Requested-With
              - Accept
            exposedHeaders:
              - X-Rate-Limit-Remaining
            maxAge: 3600
      routes:
        - id: ms-identity
          uri: ${MS_IDENTITY_URI:http://localhost:8081}
          predicates:
            - Path=/auth/**, /usuarios/**, /roles/**, /permisos/**, /solicitudes-rol/**

        # MS expone /emergencies y /announcements; el gateway acepta rutas en español y reescribe.
        - id: ms-emergencies-ruta
          uri: ${MS_EMERGENCIES_URI:http://localhost:8082}
          predicates:
            - Path=/emergencias/**
          filters:
            - RewritePath=/emergencias/activas/geojson,/emergencies/active/geojson
            - RewritePath=/emergencias/activas,/emergencies/active
            - RewritePath=/emergencias/(?<id>[a-fA-F0-9-]{36})/estado,/emergencies/${id}/status
            - RewritePath=/emergencias/(?<id>[a-fA-F0-9-]{36}),/emergencies/${id}
            - RewritePath=/emergencias,/emergencies

        - id: ms-emergencies-anuncios
          uri: ${MS_EMERGENCIES_URI:http://localhost:8082}
          predicates:
            - Path=/anuncios/**
          filters:
            - RewritePath=/anuncios(?<rest>.*),/announcements${rest}

        # Alias en español: el frontend usa /centros-acopio; el MS de recursos expone /centros.
        - id: ms-resources-centros-acopio
          uri: ${MS_RESOURCES_URI:http://localhost:8083}
          predicates:
            - Path=/centros-acopio,/centros-acopio/**
          filters:
            - RewritePath=/centros-acopio(?<rest>/.*),/centros${rest}
            - RewritePath=/centros-acopio,/centros

        - id: ms-resources
          uri: ${MS_RESOURCES_URI:http://localhost:8083}
          predicates:
            - Path=/centros/**, /inventario/**, /catalogo/**

        - id: ms-citizen
          uri: http://localhost:8084
          predicates:
            - Path=/necesidades/**, /donaciones/**

        - id: ms-logistics
          uri: http://localhost:8085
          predicates:
            - Path=/transferencias/**, /misiones/**, /rutas-voluntario/**

        - id: ms-notifications
          uri: http://localhost:8086
          predicates:
            - Path=/notificaciones/**

gateway:
  cors:
    enabled: ${GATEWAY_CORS_ENABLED:true}
  security:
    public-paths:
      - /auth/register
      - /auth/login
      - /auth/invitacion/aceptar
      - /emergencias/activas
      - /emergencias/activas/geojson
      - /emergencias/activas/**
      - /anuncios
      - /anuncios/**
      - /necesidades/publicas
      - /centros/datos-mapa
      - /actuator/**
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-resources/**
  rate-limit:
    requests-per-minute: 100

firebase:
  enabled: ${FIREBASE_ENABLED:true}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  project-id: ${FIREBASE_PROJECT_ID:}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    cl.catastrofescl: DEBUG
    org.springframework.cloud.gateway: INFO
