server:
  port: 8080

spring:
  application:
    name: catastrofecl-api-gateway
  cloud:
    gateway:
      # CORS: solo vía CorsConfig.java (gateway.cors.enabled). No usar globalcors aquí
      # para evitar doble filtro y 403 vacíos cuando Next.js reenvía Origin con IP pública.
      routes:
        - id: ms-identity
          uri: ${MS_IDENTITY_URI:http://localhost:8081}
          predicates:
            - Path=/auth/**, /usuarios/**, /roles/**, /permisos/**, /solicitudes-rol/**

        # MS expone /emergencies y /announcements; el gateway acepta rutas en español y reescribe.
        - id: ms-emergencies-ruta
          uri: ${MS_EMERGENCIES_URI:http://localhost:8082}
          predicates:
            - Path=/emergencias/**
          filters:
            - RewritePath=/emergencias/activas/geojson,/emergencies/active/geojson
            - RewritePath=/emergencias/activas,/emergencies/active
            - RewritePath=/emergencias/(?<id>[a-fA-F0-9-]{36})/estado,/emergencies/${id}/status
            - RewritePath=/emergencias/(?<id>[a-fA-F0-9-]{36}),/emergencies/${id}
            - RewritePath=/emergencias,/emergencies
            - name: CircuitBreaker
              args:
                name: msEmergenciesCb
            - name: Retry
              args:
                retries: 2
                methods: GET,HEAD
                backoff:
                  firstBackoff: 150ms
                  maxBackoff: 2s
                # Solo reintentar fallos de red / upstream caído (no 500 de negocio/BD)
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT

        - id: ms-emergencies-anuncios
          uri: ${MS_EMERGENCIES_URI:http://localhost:8082}
          predicates:
            # /anuncios sola + subrutas (p. ej. ?page= en query string usa el mismo path)
            - Path=/anuncios,/anuncios/**
          filters:
            - RewritePath=/anuncios(?<rest>.*),/announcements${rest}
            - name: CircuitBreaker
              args:
                name: msEmergenciesCb
            - name: Retry
              args:
                retries: 2
                methods: GET,HEAD
                backoff:
                  firstBackoff: 150ms
                  maxBackoff: 2s
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT

        # Alias en español: el frontend usa /centros-acopio; el MS de recursos expone /centros.
        - id: ms-resources-centros-acopio
          uri: ${MS_RESOURCES_URI:http://localhost:8083}
          predicates:
            - Path=/centros-acopio,/centros-acopio/**
          filters:
            - RewritePath=/centros-acopio(?<rest>/.*),/centros${rest}
            - RewritePath=/centros-acopio,/centros

        - id: ms-resources
          uri: ${MS_RESOURCES_URI:http://localhost:8083}
          predicates:
            - Path=/centros/**, /inventario/**, /catalogo/**, /categorias, /categorias/**

        - id: ms-citizen
          uri: ${MS_CITIZEN_URI:http://localhost:8084}
          predicates:
            - Path=/necesidades,/necesidades/**, /donaciones,/donaciones/**

        - id: ms-logistics
          uri: ${MS_LOGISTICS_URI:http://localhost:8085}
          predicates:
            - Path=/transferencias,/transferencias/**, /misiones,/misiones/**, /rutas-voluntario,/rutas-voluntario/**

        - id: ms-notifications
          uri: ${MS_NOTIFICATIONS_URI:http://localhost:8086}
          predicates:
            - Path=/notificaciones/**

gateway:
  cors:
    # All-in-one ECS: poner false. El navegador solo habla con :3000; CORS en :8080 no aplica.
    enabled: ${GATEWAY_CORS_ENABLED:false}
    frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
    extra-origin-patterns-csv: ${GATEWAY_CORS_EXTRA_ORIGIN_PATTERNS:}
  # Solo desarrollo: si Firebase está apagado, inyectar X-Firebase-Uid para que ms-emergencies (dev-trust-gateway) autorice POST/PATCH.
  dev:
    impersonate-firebase-uid: ${GATEWAY_IMPERSONATE_FIREBASE_UID:}
  security:
    public-paths:
      - /auth/register
      - /auth/login
      - /auth/invitacion/aceptar
      - /emergencias/activas
      - /emergencias/activas/geojson
      - /emergencias/activas/**
      - /anuncios
      - /anuncios/**
      - /necesidades/publicas
      # ms-resources expone GET /centros/map-data (datos optimizados de mapa) como publico
      - /centros/map-data
      - /centros-acopio
      - /centros-acopio/**
      - /actuator/**
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-resources/**
  rate-limit:
    requests-per-minute: 100

firebase:
  enabled: ${FIREBASE_ENABLED:true}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  project-id: ${FIREBASE_PROJECT_ID:}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    cl.catastrofescl: DEBUG
    org.springframework.cloud.gateway: INFO

# Circuit breaker compartido para todo el tráfico hacia ms-emergencies (emergencias + anuncios).
# Cuando abre, el filtro CircuitBreaker del Gateway devuelve 503 hasta pasar a half-open.
# timeoutDuration controla cuánto espera el filtro antes de abortar la llamada upstream.
# 30s: las operaciones de escritura (declarar emergencia con centros de acopio + persistencia
# PostGIS + publicación de eventos a RabbitMQ) superan los 8s previos, sobre todo en frío,
# y al abortar con cancelRunningFuture el cliente recibía un error de red sin respuesta.
resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: 30s
        cancelRunningFuture: true
    instances:
      msEmergenciesCb:
        baseConfig: default
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        permittedNumberOfCallsInHalfOpenState: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 45s
    instances:
      msEmergenciesCb:
        baseConfig: default
